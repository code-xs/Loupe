description: "夜间全量评估 — 每日凌晨自动触发"
cases_dir: "eval-cases/"
chains: ["A", "B", "D"]
runs_per_case: 1
parallel:
  max_sessions: 4
  scheduling_strategy: "chain_first"
  session_memory_limit: "2GB"
timeout:
  per_phase: 300
  per_case: 1800
  total: 14400
retry:
  max_retries: 2
  retry_on: [artifact_missing, session_timeout, session_crash]
scoring:
  rubric: "eval-framework/scoring-rubric-base.yaml"
  judge_model: "claude-opus-4-20250514"
  stage_scoring: true
quality_gate:
  enabled: true
  min_score: 0.75
  max_regression: 0.05
  zero_score_tolerance: 0
  min_artifact_rate: 0.90
  max_avg_agent_count: 6.5
efficiency_tracking:
  enabled: true
  compare_fanout_roi: true
  compare_deep_dive_roi: true
baseline:
  path: "eval-results/baseline-latest/"
  auto_update: true
  update_condition: "all_pass"
output:
  dir: "eval-results/nightly-{run_id}/"
  generate_report: true
  report_format: "markdown"
  save_artifacts: true
  save_session_logs: true
  save_scoring_details: true
  comparison_report: true
