description: "PR 快速评估 — 用于每次 PR 的门禁检查"
cases_dir: "eval-cases/seed-10/"
chains: ["A", "B"]
runs_per_case: 1
parallel:
  max_sessions: 4
  scheduling_strategy: "chain_first"
timeout:
  per_phase: 300
  per_case: 1200
  total: 2700
scoring:
  rubric: "eval-framework/scoring-rubric-base.yaml"
  judge_model: "claude-opus-4-20250514"
quality_gate:
  enabled: true
  min_score: 0.75
  max_regression: 0.05
  zero_score_tolerance: 0
  min_artifact_rate: 0.90
  max_avg_agent_count: 5.5
efficiency_tracking:
  enabled: true
  require_route_hit_rate: 0.70
baseline:
  path: "eval-results/baseline-latest/"
  auto_update: false
output:
  dir: "eval-results/pr-{run_id}/"
  generate_pr_comment: true
  report_format: "markdown"
  save_artifacts: true
  save_session_logs: true
