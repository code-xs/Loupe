name: QA Workflow Schema Check

# 触发：仅当 SKILL 范围或本 workflow 自身改动时运行；不阻塞 v4.1 之前不含本 SKILL 目录的旧分支。
# fail-fast：每个 step 独立失败 → 整个 job 立即失败（GitHub Actions 默认行为）。
on:
  pull_request:
    paths:
      - 'mobile-qa-workflow/**'
      - '.github/workflows/qa-workflow-schema-check.yml'
  push:
    branches: [main]
    paths:
      - 'mobile-qa-workflow/**'
      - '.github/workflows/qa-workflow-schema-check.yml'

jobs:
  schema-check:
    name: schema/protocol guard (D14/D15/D18/M16 / v4.2 PR-6 收口)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # ════════════════════════════════════════════════════════════════
      # v4.2 PR-6 / CI-D1：Check 1/2/3/4/6/13 整段下线（依赖 allowlist 与 ANCHOR-N1/N2 已物理删除）
      # 详见 construction-plans/v4.2/pr-6-d14-inline-removal-and-system-prompt-rebuild-v1.1.md §2.15
      # ════════════════════════════════════════════════════════════════

      # ════════════════════════════════════════════════════════════════
      # 检查 7：M16 config-schema 键漂移
      # 主文档锚点：§3 PR-8 评审重点 #7 / §5.1 第 5 项
      # ════════════════════════════════════════════════════════════════
      - name: Check 7 — M16 config-schema 键漂移 (config_source 写入键全部注册)
        run: bash mobile-qa-workflow/scripts/check-config-schema.sh

      # ════════════════════════════════════════════════════════════════
      # 检查 8：D18 parse_error_count 4 类生命周期动作闭合
      # 主文档锚点：§5.1 第 12 项（D18 配套）
      # 4 类动作：
      #   a) parse_error_count += 1
      #   b) 解析成功后清零
      #   c) 进入新 step-pause 前清零
      #   d) 熔断（>= 3）后清零
      # ════════════════════════════════════════════════════════════════
      - name: Check 8 — D18 parse-error 4 类生命周期动作闭合
        run: |
          set -euo pipefail
          WF=mobile-qa-workflow/core/workflow.xml
          fail=0
          declare -A NEED=(
              [a_increment]='parse_error_count[[:space:]]*\+=[[:space:]]*1'
              [b_reset_on_success]='parse_error_count[[:space:]]*=[[:space:]]*0.*(成功|D18[[:space:]]*解析成功)'
              [c_reset_before_pause]='parse_error_count[[:space:]]*=[[:space:]]*0.*(进入新|D18[[:space:]]*进入新)'
              [d_reset_on_circuit_break]='parse_error_count[[:space:]]*=[[:space:]]*0.*(熔断|D18[[:space:]]*熔断)'
          )
          for k in "${!NEED[@]}"; do
            if ! grep -qE "${NEED[$k]}" "$WF"; then
              echo "[D18-FAIL] missing lifecycle action: ${k} (regex: ${NEED[$k]})"
              fail=1
            fi
          done
          if [ $fail -eq 0 ]; then
            echo "[D18-OK] all 4 parse_error_count lifecycle actions present (a/b/c/d)"
          fi
          exit $fail

      # ════════════════════════════════════════════════════════════════
      # 检查 9（v4.2 PR-1 启用）：state enum 守门 / V1.1 §3.1 O5 / 主控 §4 / 等级：error
      # ════════════════════════════════════════════════════════════════
      - name: Check 9 — state enum 守门
        run: bash mobile-qa-workflow/scripts/check-state-enum.sh

      # ════════════════════════════════════════════════════════════════
      # 检查 10（v4.2 PR-2 升级 error）：system-prompt sync 守门
      #   前置：SCRIPT-FIX1 修复提取器 + ANCHOR-N1/N2 锚点已加 + 实跑零 warning
      #   v4.2 PR-2 / CI-U1b：删除 SP_SYNC_SEVERITY=warning，默认即 error
      # ════════════════════════════════════════════════════════════════
      - name: Check 10 — system-prompt sync 守门
        run: bash mobile-qa-workflow/scripts/check-system-prompt-sync.sh

      # ════════════════════════════════════════════════════════════════
      # 检查 11（v4.2 PR-6 v1.1 / Review Finding 4-A 收口：维持 warning）：io-contract 守门
      # 维持 warning 理由：basename 算法的变量化兜底过宽，假绿守门价值不足；
      # single-form 强守门由 Check 17（SCRIPT-D6）独立 error 承担，二者解耦避免假闭环。
      # 本脚本 v4.2 PR-6 / SCRIPT-D1 已删除 allowlist 豁免；mutex 段保留作为 inline 形态回潮兜底。
      # ════════════════════════════════════════════════════════════════
      - name: Check 11 — io-contract 守门
        run: bash mobile-qa-workflow/scripts/check-io-contract.sh

      # ════════════════════════════════════════════════════════════════
      # 检查 12（v4.2 PR-1 启用）：subagent-params 守门（v1.1 含双向反向断言）/ 等级：error
      # ════════════════════════════════════════════════════════════════
      - name: Check 12 — subagent-params 守门
        run: bash mobile-qa-workflow/scripts/check-subagent-params.sh

      # ════════════════════════════════════════════════════════════════
      # v4.2 PR-6 / CI-D1 + SCRIPT-D5：Check 13 整段下线，配套
      #   git rm mobile-qa-workflow/scripts/check-build-system-prompt-precondition.sh
      # H1 守门完成历史使命（PR-6 SP-N1 已首次自动构建 system-prompt.md）。
      # 替代守门：Check 9 (state-enum) + Check 10 (sync 三元组) + Check 15 (phase-abort/complete)
      #          + Check 16 (registry 双向) + Check 17 (single-form) 五件套联防。
      # ════════════════════════════════════════════════════════════════

      # ════════════════════════════════════════════════════════════════
      # 检查 14（v4.2 PR-2 启用）：build-system-prompt 单测 + P3 反查回放用例
      # 同时跑 GEN-N2（生成器单测）+ TEST-N1（READ-N1 反查算法等价回放）
      # ════════════════════════════════════════════════════════════════
      - name: Check 14 — build-system-prompt + p3-reentry replay tests
        run: |
          if [ -f mobile-qa-workflow/scripts/requirements.txt ]; then
            pip install -r mobile-qa-workflow/scripts/requirements.txt
          fi
          python -m unittest discover -s mobile-qa-workflow/scripts/tests/ -v

      # ════════════════════════════════════════════════════════════════
      # 检查 15（v4.2 PR-6 升级 error）：phase-abort / phase-complete 宏结构守门
      # 范围：主链路 phases/*.md（6 个 phase）；功能 deep-dive 不在本 PR 治理范围。
      # 守门：① state ∈ 权威 enum 集（占位字面 "{...}" 跳过）
      #       ② fields top-level key ∈ workflow-status-template.yaml 顶层字段表
      #       ③ phase 文件含宏 ≥ 1（PR-6 SCRIPT-D3 删除 P4 notice 特例）
      # 严重度：PR-6 起 PHASE_ABORT_SEVERITY 默认 error（脚本内置 / 见 SCRIPT-D3）
      # 关联：V1.1 §3.2.22 / 主文档 §2.9 / ADR-021
      # ════════════════════════════════════════════════════════════════
      - name: Check 15 — phase-abort/complete 宏结构守门
        run: bash mobile-qa-workflow/scripts/check-phase-abort-structure.sh

      # ════════════════════════════════════════════════════════════════
      # 检查 16（v4.2 PR-5 启用 error）：step-pause-registry 守门 / V1.1 §3.2.22 / O22 / SCRIPT-N1
      # 三类校验（v1.1 修订 / Patch C 双向严格相等 + Patch A Boundary-Refined 路由项）：
      #   ① state 合法性（registry 每个 state ∈ workflow-status-template.yaml enum 集）
      #   ② step 4a/4b/4c 拆分检测 + 双向严格相等
      #      （EXPECTED = 6 交互态 + Boundary-Refined；分类报 missing / unexpected）
      #   ③ step 4a/4b/4c 区间内零硬编码 case（H3 强约束 / 黑名单含 Boundary-Refined + Fix-Confirming）
      # 严重度：error 起步（无 warning 过渡 / ADR-010 §6.4 / 主控 §4 / 阻塞合入）
      # 关联：ADR-010 active + V1.1 §3.2.10+ Stage-1+Stage-2 + Registry 权威性约束
      # ════════════════════════════════════════════════════════════════
      - name: Check 16 — step-pause-registry 守门 (v4.2 PR-5 / O10+ / O22 / H3)
        run: bash mobile-qa-workflow/scripts/check-step-pause-registry.sh

      # ════════════════════════════════════════════════════════════════
      # 检查 17（v4.2 PR-6 v1.1 新增 / Review Finding 4-A 收口）：step-pause single-form 守门
      # 守门：v4.2 PR-6 起 <step-pause> 唯一合法形态 = registry-only
      #       （含 registry-key 且不含 title / result_field / allowed_values / option）
      # 与 Check 11 (io-contract) 解耦：本 Check 是 single-form 强守门 (error)，
      # Check 11 是 io-contract basename 弱守门 (warning) + mutex 兜底防线
      # 关联：SCRIPT-D6 / ADR-016 v4.2 修订段 #2 / RULES-D3
      # ════════════════════════════════════════════════════════════════
      - name: Check 17 — step-pause single-form 守门
        run: bash mobile-qa-workflow/scripts/check-step-pause-form.sh

      # ════════════════════════════════════════════════════════════════
      # 检查 18（v4.2 PR-7 / GEN-PR7 / §5.1 必做）：<load target> 路径可达性守门
      # 守门范围：
      #   - phases/**/*.md、agents/**/*.md（排除 archive）、reference/**/*.md、core/**/*.{xml,md}、SKILL.md
      #   - functionality-deep-dive/{phases,agents,reference,core}/**/*.{md,xml}
      # 规则：解析所有 <load target="..."> / target='...'，路径必须 test -f 可达；不可达即 error
      # 兼容：{var} / ... 占位示例路径跳过（文档示例，不是可执行 load）
      # 补充：校验 PR-7 新增 9 个文件存在性 + 4 个关键目标具备静态 load 触达
      # ════════════════════════════════════════════════════════════════
      - name: Check 18 — load target 路径可达性守门 (GEN-PR7)
        run: bash mobile-qa-workflow/scripts/check-load-targets.sh

      # ════════════════════════════════════════════════════════════════
      # 检查 19（v4.2 PR-7 / O23 / D-AGG-1 新增）：core-rules 聚合产物同步守门
      # 守门：core/core-rules.xml 必须 = aggregate(core-rules-essential.xml + core-rules-dsl-reference.xml)
      # 严重度：error 起步（PR-7 起 core-rules.xml 是生成产物，禁止手改）
      # 修复指引：本地编辑 essential / dsl-reference 后必跑：
      #   python3 mobile-qa-workflow/scripts/sync-core-rules-aggregate.py --write
      # 关联：v4.2 PR-7 §3.3.1 D-AGG-1 / O23
      # 注：Check 18 编号预留给 PR-7 的 scripts/check-load-targets.sh（GEN-PR7 / CI 任务）。
      # ════════════════════════════════════════════════════════════════
      - name: Check 19 — core-rules 聚合产物同步守门 (D-AGG-1)
        run: python3 mobile-qa-workflow/scripts/sync-core-rules-aggregate.py --check

      # ════════════════════════════════════════════════════════════════
      # 检查 20（v4.2 PR-7 / O24 / D-AGG-2 / R24-1 / C1 新增）：reasoning-chain 聚合产物同步守门
      # 守门：reference/reasoning-chain.md 必须 = aggregate(
      #         reasoning-chain-core.md
      #         + reasoning-guide-{functional,ui,network,compat}.md  (4 guides 固定顺序)
      #       )
      # 严重度：error 起步（PR-7 起 reasoning-chain.md 是 C1 静态拼贴生成产物，禁止手改）
      # 修复指引：本地编辑 core / 任一 guide 后必跑：
      #   python3 mobile-qa-workflow/scripts/sync-reasoning-chain-aggregate.py --write
      # 关联：v4.2 PR-7 §3.4 / §3.4.1 R24-1 + C1 / O24
      # ════════════════════════════════════════════════════════════════
      - name: Check 20 — reasoning-chain 聚合产物同步守门 (D-AGG-2)
        run: python3 mobile-qa-workflow/scripts/sync-reasoning-chain-aggregate.py --check

      # ════════════════════════════════════════════════════════════════
      # 检查 21（v4.2 PR-7 / O25 / §2.2 / §3.5 新增）：SubAgent load 路径合规性守门
      # 守门：phases/{p3,p4,p5}.md + functionality-deep-dive/phases/{f1..f5}.md
      #       的 invoke-subagent.subagent_prompt 内必须 load
      #       core/core-rules-subagent.xml；禁止再 load 完整 core/core-rules.xml。
      # 严重度：error 起步（防止 SubAgent token 收益面回流）
      # 范围：与 §A.1 标记 "O25 命中" 的 14+6 = 20 处一致；新增 / 删除
      #       invoke-subagent 时需同步脚本顶部的 EXPECTED_TOTAL 与 §A.1。
      # 排除：phases/p2-spec-definition.md L128（curator → essential，待后续小段提交）
      # ════════════════════════════════════════════════════════════════
      - name: Check 21 — SubAgent load 路径合规性 (O25)
        run: bash mobile-qa-workflow/scripts/check-subagent-load-target.sh

      # ════════════════════════════════════════════════════════════════
      # 检查 22（v4.2 PR-7 / O11+ / §2.1 E1 新增）：Coder 入口唯一性 + 下游顺序守门
      # 守门：
      #   (a) agents/coder-workflow.md / reference/contract-checklist-spec.md
      #       只能由 agents/coder-agent.md 入口 <load>，禁止双写
      #       （P6 例外：单独 load contract-checklist-spec.md 仅在
      #        phases/p6-verification.md 内允许，当前不触发，作 v4.3 接口预留）
      #   (b) 入口必须按固定顺序先 load coder-workflow.md，再 load contract-checklist-spec.md
      #   (c) phases/p5-fix-impl.md 必须 <load coder-agent.md>（唯一入口）
      # 严重度：error 起步（防 §2.1 E1 双写口径回流）
      # ════════════════════════════════════════════════════════════════
      - name: Check 22 — Coder 入口唯一性 (O11+ / §2.1 E1)
        run: bash mobile-qa-workflow/scripts/check-coder-entry.sh
