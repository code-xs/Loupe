# 评分标尺基础配置
# 所有维度的评分标准和权重

# 归因准确率评分标准
attribution_scoring:
  exact_match: 10.0          # 主根因精确匹配
  partial_match: 7.0          # 部分匹配（方向正确但不精确）
  contributing_match: 4.0     # 仅识别了贡献因子
  miss: 0.0                   # 完全未命中
  false_positive: -2.0        # 错误根因（从 0 分扣减）

# 维度权重（V3.1: 9 维度，总和 = 1.00）
weights:
  # 原 6 维度（重分配，总和 0.85）
  attribution_accuracy: 0.30
  contributing_completeness: 0.12
  fix_correctness: 0.18
  reasoning_depth: 0.08
  artifact_completeness: 0.09
  defensive_fix_quality: 0.08
  # V3.1 新增 3 维度（总和 0.15）
  contract_first_pass_accuracy: 0.08
  hallucination_interception: 0.04
  self_healing_rate: 0.03

# 阶段级评分（Functionality Deep-Dive）
stage_scoring:
  F1_context_reconstruction:
    auto_checks:
      - name: "environment_factors_non_empty"
        description: "环境因子列表非空"
        weight: 0.3
    llm_judge:
      - name: "factor_accuracy"
        description: "因子与 ground truth 对比"
        weight: 0.7

  F2_state_topology:
    auto_checks:
      - name: "mermaid_syntax_valid"
        description: "Mermaid 语法校验"
        weight: 0.3
    llm_judge:
      - name: "state_completeness"
        description: "状态定义完整性"
        weight: 0.7

  F3_temporal_correlation:
    auto_checks:
      - name: "temporal_events_count"
        description: "时序事件数 ≥ 3"
        threshold: 3
        weight: 0.3
    llm_judge:
      - name: "race_window_accuracy"
        description: "竞态窗口准确性"
        weight: 0.7

  F4_isolation_debate:
    auto_checks:
      - name: "debate_rounds"
        description: "对抗轮数 ≥ 1"
        threshold: 1
        weight: 0.2
    llm_judge:
      - name: "root_cause_match"
        description: "主根因与 ground truth 匹配度"
        weight: 0.8

  F5_defensive_fix:
    auto_checks:
      - name: "circuit_breaker_exists"
        description: "熔断器/断言点存在性"
        weight: 0.3
    llm_judge:
      - name: "architecture_quality"
        description: "修复方案架构评价"
        weight: 0.7

# V3.1 新增维度评分标准
contract_tracing_scoring:
  contract_first_pass_accuracy:
    description: "契约溯源首次通过准确率"
    scoring:
      10: "所有跨模块引用首轮溯源全部匹配，无需修正"
      7: "首轮溯源 ≥80% 匹配，少量修正后全部通过"
      4: "首轮溯源 50-80% 匹配，需多轮修正"
      0: "首轮溯源 <50% 匹配或未执行溯源"
    data_source: "contract-checklist.md 中匹配状态统计"

  hallucination_interception:
    description: "幻觉拦截率"
    scoring:
      10: "溯源过程中发现并修正了所有臆测引用（或无臆测发生）"
      7: "拦截了大部分臆测引用，少量漏网"
      4: "仅拦截了部分臆测引用"
      0: "未执行溯源或臆测引用未被拦截"
    data_source: "contract-checklist.md 中不匹配项 + impl-report 纠错记录"

  self_healing_rate:
    description: "自愈修复率（微验证纠错成功率）"
    scoring:
      10: "编码一次通过无需纠错，或所有纠错均在 3 轮内成功"
      7: "纠错成功但消耗了 2-3 轮"
      4: "部分纠错成功，部分失败触发 Human-Review"
      0: "纠错全部失败，全量触发 Human-Review"
    data_source: "impl-report 微验证纠错记录 + Execution-Status"

# 质量阈值
quality_thresholds:
  pass: 7.5                   # ≥ 7.5 分为通过
  weak: 7.0                   # < 7.0 分标记为薄弱
  fail: 5.0                   # < 5.0 分标记为失败
  critical: 3.0               # < 3.0 分标记为严重
