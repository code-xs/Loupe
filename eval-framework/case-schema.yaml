# Case 元数据 Schema

case_metadata:
  case_id:
    type: string
    required: true
    pattern: '^case-\d{3}-[a-z0-9-]+$'
  title:
    type: string
    required: true
  category:
    type: enum
    required: true
    values: [状态机紊乱, 竞态, 缓存脏读, 生命周期耦合, Crash, 性能, 多模块联动, 网络异常, UI异常, 兼容性]
  complexity:
    type: enum
    required: true
    values: [Simple, Medium, Complex, Extreme]
  platform:
    type: enum
    required: true
    values: [Android, iOS, Both]
  intermittent:
    type: enum
    required: true
    values: [必现, 高概率偶发, 极低概率偶发]
  info_completeness:
    type: enum
    required: true
    values: [日志充分, 日志残缺, 仅描述无日志]
  expected_route:
    type: enum
    required: true
    values: [standard-rca, functionality-deep-dive, ui-deep-dive]
  expected_fanout_mode:
    type: enum
    required: false
    values: [simple-single, medium-challenge, complex-arbitrated]
  expected_fix_mode:
    type: enum
    required: false
    values: [single-proposer, challenged-proposer, contested-arbitrated]
  tags:
    type: list
    items: string
    required: false

directory_structure:
  required_dirs: [input/, ground-truth/]
  required_files:
    - metadata.yaml
    - input/issue-description.md
    - ground-truth/expected-root-cause.md
    - ground-truth/expected-contributing.md
    - ground-truth/expected-fix-direction.md
    - ground-truth/scoring-rubric.yaml
