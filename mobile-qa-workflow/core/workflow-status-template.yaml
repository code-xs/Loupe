# Mobile QA Workflow 状态模板文件，禁止修改此文件格式
# ⚠️ CRITICAL: 此文件必须保持严格 YAML 格式，LLM 禁止修改结构
#
# current_state 合法枚举集（C5 单一权威源，v4.2 完整集合）：
#   Intake / Spec-Defining / Spec-Uncertain / Context-Curating / Curation-Failed
#   / Boundary-Refined / Non-Bug / Info-Insufficient / RCA-Designing
#   / RCA-LowConfidence / Fix-Designing / Fix-Confirming / Fix-Implementing
#   / Verifying / Human-Review / Done
# 任何 phase / 编排器 / 文档新增的 current_state 取值，必须先在此处注册并同步
# SKILL.md / system-prompt.md / PLATFORM-GUIDE.md。

# [PRESERVE_FORMAT]
issue_id: null
current_state: Intake
platform: null
priority: null
Issue_Boundary_Level: null
Boundary_Confidence: null
Runtime_Anchor_Availability: null
last_updated: null
active_branch: null
stepsCompleted: []
lastStep: null
# ── group: retries（注释级归类，不动 schema） ──
# 5 个计数器顶层字段语义同属"重试 / 熔断"组：
#   · non_bug_reflow_count   — Non-Bug 跨轮回流次数（>= 2 → Human-Review）
#   · lint_retry_count       — coder-agent <try retry="3"> 内部隐式管理
#   · rca_retry_count        — RCA 升级 / 回流计数（> 2 → Human-Review）
#   · fix_retry_count        — Fix 升级 / 回流计数（> 2 → Human-Review）
#   · parse_error_count      — step-pause 连续解析失败熔断（>= 3 → Human-Review）
# 写入端 / 重置规则各自独立（详见各 phase 文件）；本注释仅做归类提示。
non_bug_reflow_count: 0
lint_retry_count: 0
workflow_version: "abc-1"
schema_version: 4
analysis_complexity: null
analysis_complexity_confidence: null

# Spec-Uncertain 用户回复写入（ADR-014）；取值 1/2/parallel；老会话缺失时 default null。
selected_spec_index: null

# fanout_mode 命名约束（D7）：保留为 RCA 字段，不重命名为 rca_fanout_mode；
# Fix 阶段一律改写 fix_fanout_mode（C10 字段隔离）。
fanout_mode: null
fix_fanout_mode: null    # Fix 阶段路由模式字段（与 RCA 字段 fanout_mode 隔离）。
# 已废弃字段 rca_fanout_mode_snapshot / fix_strategy_mode 已删除（见 ADR-007）。

fix_risk_level: null
reroute_reason: null
reroute_from_phase: null
reroute_target_phase: null
rca_retry_count: 0
fix_retry_count: 0
verification_failure_type: null

# phase_history：阶段执行历史，元素结构 { phase, timestamp, fanout_mode, note? }；
# P3 完成时 append，P3 重入时反查最近 qa-root-cause 条目还原 fanout_mode。
phase_history: []

# user_inputs：step-pause 用户回复命名空间；编排器 4a 单写 user_inputs.<result_field>（详见 ADR-015）。
user_inputs: {}

# Non-Bug 上下文：承载最近一次 P2 Non-Bug 判定说明，供 step-pause 标题占位；
# 与 non_bug_reflow_count（跨轮计数）职责正交，用户选择走 user_inputs.non_bug_user_choice。
non_bug_context: null

# parse-error 熔断计数器：进入新 step-pause / 解析成功 → 清零；解析失败 → +1；>= 3 → Human-Review 并清零。
parse_error_count: 0

# 顶层镜像字段已全部下线（见 ADR-015）。

# ── 以下保留不动：specialized_workflow + [END_PRESERVE_FORMAT] ──
specialized_workflow:
  mode: null
  status: null
  sub_workspace: null
  trigger_reason: null
  merge_strategy: null
# [END_PRESERVE_FORMAT]
