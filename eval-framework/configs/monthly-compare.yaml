monthly_compare:
  cases: "eval-cases/"
  chains: ["A", "B", "C", "D"]
  runs_per_case: 1
  compare_with_last_month: true
  report:
    format: "markdown"
    output_path: "eval-results/monthly-report.md"
    include_sections:
      - overview_table
      - incremental_analysis
      - category_breakdown
      - complexity_breakdown
      - efficiency_metrics
      - regression_check
      - low_score_cases
  thresholds:
    regression_threshold: 0.05
    target_expert_accuracy: 0.80
    target_expert_vs_base: 1.00
    target_expert_vs_external: 0.20
    target_route_hit_rate: 0.80
    target_avg_agent_count: 6.0
  chain_c_input:
    method: "manual"
    input_dir: "eval-results/chain-c-manual/"
