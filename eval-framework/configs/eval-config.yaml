runner_config:
  loupe_model: claude-sonnet-4-20250514
  baseline_model: claude-sonnet-4-20250514
  judge_model: claude-opus-4-20250514
  temperature: 0.1
  max_retries: 2
  timeout_per_phase: 300
  timeout_per_case: 1800
  parallel_sessions: 1

parallel_config:
  max_sessions: 4
  session_memory_limit: "2GB"
  chain_parallel: true
  case_parallel: true
  scheduling_strategy: "chain_first"

execution_profiles:
  pr_quick:
    cases: "eval-cases/seed-10/"
    chains: ["A", "B"]
    runs_per_case: 1
    description: "PR 快速评估：10 种子 Case × Chain A+B"
  nightly:
    cases: "eval-cases/"
    chains: ["A", "B", "D"]
    runs_per_case: 1
    description: "夜间全量评估：全部 Case × Chain A+B+D"
  weekly:
    cases: "eval-cases/"
    chains: ["A", "B", "D"]
    runs_per_case: 3
    description: "周评估：全部 Case × Chain A+B+D × 3 次取均值"
  monthly:
    cases: "eval-cases/"
    chains: ["A", "B", "C", "D"]
    runs_per_case: 1
    description: "月度全链路评估：含 Chain C 外部 B2C 结果"

chain_definitions:
  A:
    name: "主流程（标准 RCA）"
    executor: "ide_session"
    skill: "mobile-qa-workflow"
    mode: "standard"
  B:
    name: "专家模式（Functionality Deep-Dive）"
    executor: "ide_session"
    skill: "mobile-qa-workflow"
    mode: "expert"
  C:
    name: "外部 B2C 方案"
    executor: "manual_input"
  D:
    name: "LLM 裸跑基线"
    executor: "baseline_runner"
    model: "claude-sonnet-4-20250514"

output_config:
  results_dir: "eval-results/"
  baseline_dir: "eval-results/baseline-latest/"
  state_file: "eval-results/eval-state.json"
  log_level: "INFO"
  save_session_logs: true

efficiency_tracking:
  enabled: true
  metrics: [avg_agent_count, score_per_agent, deep_dive_activation_rate, expected_route_hit_rate, expected_fanout_hit_rate]

ide_config:
  adapter: "trae"
  headless: true
  skill_path: "mobile-qa-workflow"
  auto_reply_config: "eval-framework/auto-reply-rules.yaml"
  graceful_shutdown_timeout: 10
  health_check_interval: 30
